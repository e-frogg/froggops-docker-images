name: fops-ci-php

on:
  push:
    branches: ["main"]
    paths:
      - "fops-ci-php/**"
      - ".github/workflows/_docker-image.yml"
      - ".github/workflows/fops-ci-php.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "fops-ci-php/**"
      - ".github/workflows/_docker-image.yml"
      - ".github/workflows/fops-ci-php.yml"

concurrency:
  group: fops-ci-php-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "8.3"
            php-base-image: "php:8.3.35-cli@sha256:aafe21201943a8a6e497ddfb471e2ce68ada76adede38c7d61fede8918b24319"
          - version: "8.4"
            php-base-image: "php:8.4.26-cli@sha256:1d2cf2b7d715b5b3aa959f0150ccbcc7b71e0181b637e443abf40a7fb56bf79a"
          - version: "8.5"
            php-base-image: "php:8.5.11-cli@sha256:01a109229f4465bc9ef042d9198f09a4d9da7775a825dbd8572dcdbd8756c4d3"
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      image: fops-ci-php
      version: ${{ matrix.version }}
      php-base-image: ${{ matrix.php-base-image }}
      context: ./fops-ci-php
      dockerfile: ./fops-ci-php/Dockerfile
      trivy-category: trivy-fops-ci-php-${{ matrix.version }}
      latest: ${{ matrix.version == '8.4' }}
      trivy-skip-dirs: /root/.composer
